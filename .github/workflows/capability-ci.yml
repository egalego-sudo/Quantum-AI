name: QUANTUM AI Capability CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "ApkPatchLibrary/**"
      - "backend/**"
      - "docs/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/capability-ci.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/knowledge-base-tests.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: quantum-capability-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, audit and test backend
        run: |
          npm ci --ignore-scripts --prefix backend
          npm audit --prefix backend --audit-level=high
          node --check backend/server.js
          npm test --prefix backend
          node scripts/verify-build-inventory.mjs
          node scripts/verify-android-navigation.mjs

      - name: Live QUANTUM AI backend health smoke test
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/quantum-backend-health.json"
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            "https://astraquantum-ai.onrender.com/health" \
            --output "$response"
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(data.ok!==true || data.service!=="QUANTUM AI backend") process.exit(1); process.stdout.write("Backend health endpoint returned the expected service identity.\n");' "$response"

      - name: Host native patch parser smoke tests
        shell: bash
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L \
            -I ApkPatchLibrary/src/main/cpp \
            ApkPatchLibrary/src/test/cpp/bspatch_smoke_test.c \
            ApkPatchLibrary/src/main/cpp/bspatch.c \
            ApkPatchLibrary/src/main/cpp/bzip2/bzlib.c \
            ApkPatchLibrary/src/main/cpp/bzip2/compress.c \
            ApkPatchLibrary/src/main/cpp/bzip2/decompress.c \
            ApkPatchLibrary/src/main/cpp/bzip2/crctable.c \
            ApkPatchLibrary/src/main/cpp/bzip2/randtable.c \
            ApkPatchLibrary/src/main/cpp/bzip2/blocksort.c \
            ApkPatchLibrary/src/main/cpp/bzip2/huffman.c \
            -o "$RUNNER_TEMP/bspatch-smoke-tests"
          "$RUNNER_TEMP/bspatch-smoke-tests"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QUANTUM-AI-PR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    name: Android emulator instrumentation tests
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android emulator core-flow and memory persistence tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          ndk: 29.0.14206865
          cmake: 3.31.6
          script: bash .github/scripts/run-emulator-tests.sh

      - name: Upload emulator crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QUANTUM-AI-PR-emulator-diagnostics
          path: |
            ${{ runner.temp }}/quantum-emulator-logcat.txt
            ${{ runner.temp }}/quantum-emulator-processes.txt
          if-no-files-found: warn
          retention-days: 14
