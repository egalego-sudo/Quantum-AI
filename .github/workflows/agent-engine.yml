name: QUANTUM AI Agent Engine Tests

on:
  push:
    branches:
      - feature/autonomous-agent-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.16"
      - name: Run agent engine contract tests
        working-directory: backend
        run: node --test agents/agent-engine.test.js
